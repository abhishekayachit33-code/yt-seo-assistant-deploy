apiVersion: apps/v1
kind: Deployment
metadata:
  name: yt-seo-assistant
  namespace: yt-seo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yt-seo-assistant
  template:
    metadata:
      labels:
        app: yt-seo-assistant
    spec:
      containers:
        - name: yt-seo-assistant
          image: docker.io/abhishekayachit/yt-seo-assistant:4f6a951
          ports:
            - containerPort: 8501
          envFrom:
            - secretRef:
                name: yt-seo-secrets
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
