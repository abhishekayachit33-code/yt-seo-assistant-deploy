apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yt-seo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/abhishekayachit33-code/yt-seo-assistant-deploy.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: yt-seo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
